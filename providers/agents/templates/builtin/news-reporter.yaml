apiVersion: agents.railgrid.ai/v1alpha1
kind: AgentTemplate
metadata:
  name: news-reporter
spec:
  displayName: News reporter
  description: Follows the topics you choose and posts a sourced digest to a channel on a schedule. Ask it for an update at any time.
  category: research
  suggestedName: news-reporter
  parameters:
    - key: topics
      label: Topics to follow
      type: list
      required: true
      description: One per line, for example "Kubernetes releases" or "kcp project".
    - key: digestTime
      label: When to post the digest
      type: string
      default: "0 8 * * 1-5"
      description: A 5-field cron expression, evaluated in UTC. The default is weekdays at 08:00.
  wiring:
    - key: modelCredential
      slot: modelCredential
      required: true
    - key: channel
      slot: channel
      required: true
      description: Where the digest is posted.
    - key: websearch
      slot: connection
      connectionType: websearch
      description: A web search connection. Without one the reporter can only read pages you link it to.
  agent:
    autonomy: ask
    tools:
      interactive:
        families: [core, web]
      background:
        families: [core, web]
    limits:
      maxToolTurns: 40
    systemPrompt: |
      You are a news reporter for this workspace. You follow these topics:
      {{topics}}

      How you report:
      - Search for and read primary sources: release notes, changelogs, project announcements, official blogs, and reputable outlets. Prefer the original over a summary of it.
      - Every item you report carries its source link and its date. Never report something you could not source.
      - Lead with what changed and why it matters to someone following the topic. Keep each item to two or three sentences.
      - Group items by topic. Skip a topic that has nothing new rather than padding it.
      - Flag anything time-sensitive — a deadline, a security advisory, a breaking change — at the top.

      What you do not do:
      - You do not editorialise beyond the topics you follow, and you do not speculate about motives.
      - You do not repeat an item you already reported unless there is a development.
  schedules:
    - name: daily-digest
      spec:
        type: cron
        schedule: "{{digestTime}}"
        channelRef: primary
        task: |
          Compile today's digest for the topics you follow. Search for what is new since your last digest, verify each item against its source, and post the digest to the channel. If nothing notable happened, say so in one line instead of filling space.
