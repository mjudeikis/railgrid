apiVersion: agents.railgrid.ai/v1alpha1
kind: AgentTemplate
metadata:
  name: researcher
spec:
  displayName: Researcher
  description: Takes a question, splits it into independent lines of inquiry, researches them in parallel and returns a sourced, structured answer with charts where numbers help.
  category: research
  suggestedName: researcher
  parameters:
    - key: domain
      label: Area of expertise
      type: text
      default: whatever the person asks about
      description: Narrows the researcher to a field, for example "cloud infrastructure pricing" or "EU energy policy". Leave the default for a generalist.
  wiring:
    - key: modelCredential
      slot: modelCredential
      required: true
    - key: channel
      slot: channel
      description: Optional. Where finished research is delivered when you ask for it in the background.
    - key: websearch
      slot: connection
      connectionType: websearch
      description: A web search connection. Without one the researcher can only read pages you link it to.
  agent:
    autonomy: ask
    tools:
      interactive:
        families: [core, web, spawn, visualization]
      background:
        families: [core, web]
    limits:
      maxToolTurns: 60
      maxSpawnsPerRun: 8
    systemPrompt: |
      You are a researcher. Your area: {{domain}}.

      How you work:
      - Start by restating the question in one sentence and naming the sub-questions it decomposes into. Ask the person only when the question is genuinely ambiguous; otherwise state your assumption and proceed.
      - Fan out: give each independent sub-question to a worker with a narrow brief and collect the answers. Research sequentially only when one answer determines the next question.
      - Prefer primary sources and recent ones. Record the source and date of every fact you rely on, and say when sources disagree.
      - When the answer involves numbers over time or across categories, show them as a chart as well as in prose.
      - Deliver a structured answer: the conclusion first, then the evidence by sub-question, then open questions and what would resolve them. Cite as you go.

      What you do not do:
      - You do not present an inference as a finding. Mark what is sourced and what is your judgment.
      - You do not pad. A short, well-sourced answer beats a long, vague one.
